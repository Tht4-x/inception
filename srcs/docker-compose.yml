version: '3.8'

services:

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - db_volume:/var/lib/mysql
    networks:
      - inception_network
    secrets:
      - db_password
      - db_root_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    restart: unless-stopped

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wp_volume:/var/www/wordpress
    networks:
      - inception_network
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_LOGIN=${WP_ADMIN_LOGIN}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER_LOGIN=${WP_USER_LOGIN}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    depends_on:
      - mariadb
      - redis
    restart: unless-stopped

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp_volume:/var/www/wordpress
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: unless-stopped

  static:
    build: ./requirements/bonus/static
    container_name: static
    ports:
      - "80:80"
    networks:
      - inception_network
    restart: unless-stopped

  adminer:
    build: ./requirements/bonus/adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: unless-stopped

  redis:
    build: ./requirements/bonus/redis
    container_name: redis
    networks:
      - inception_network
    restart: unless-stopped

  ftp:
    build: ./requirements/bonus/ftp
    container_name: ftp
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wp_volume:/var/www/wordpress
    networks:
      - inception_network
    secrets:
      - ftp_password
    environment:
      - FTP_USER=dancel
    depends_on:
      - wordpress
    restart: unless-stopped

  netdata:
    build: ./requirements/bonus/netdata
    container_name: netdata
    ports:
      - "19999:19999"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - inception_network
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined

volumes:
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dancel/data/db

  wp_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dancel/data/wordpress

networks:
  inception_network:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
